# Builds double-clickable apps for macOS and Windows and attaches them to a
# release on this (private) repo — which is all the distribution F2 asks for:
# Andy is authenticated, so he can download his own release assets. Nothing
# here signs or notarizes.
#
# Push a tag to publish:      git tag v0.2.0 && git push origin v0.2.0
# Or run it by hand for a dry run: both installers land as workflow artifacts
# and no release is touched.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # One job creates the release, so the two build jobs never race to create it
  # and then fall back to uploading. They only ever upload.
  create:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"          # a -preview suffix on the tag is fine
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          Unsigned local builds — both platforms warn on first launch, once.

          - **macOS (Apple Silicon)** — `.dmg`. First launch: open it once, then **System Settings → Privacy & Security → Open Anyway** (right-click → Open no longer works on macOS 15+). It will not run on an Intel Mac.
          - **Windows (x64)** — `.exe`. SmartScreen says "Windows protected your PC": **More info** → **Run anyway**.

          [EDOPro](https://projectignis.github.io/) must be installed; the app reads its card data and never uploads anything. See `docs/INSTALL.md`.
          NOTES
          )"

  build:
    needs: [create]
    # `always()` so a dry run, where `create` is skipped, still builds.
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped')
    strategy:
      fail-fast: false        # one platform failing must not hide the other's result
      matrix:
        include:
          - os: macos-latest
            script: package:mac
            pattern: dist/*.dmg
            artifact: dmg
          - os: windows-latest
            script: package:win
            pattern: dist/*.exe
            artifact: exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

      # A macOS app whose signature does not cover its bundle is reported as
      # "damaged and can't be opened" on every downloaded copy, with no way
      # past it — which is how v0.2.0 through v0.5.0 shipped, because
      # `identity: null` skips signing and nothing checked. Fail the build
      # rather than publish that again.
      - name: Verify the macOS app's signature
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d dist/mac-arm64/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Identifier=io.github.96jonesa.ygo-deck-optimizer' \
            || { echo "the app is not signed as itself (still the stock Electron signature?)" >&2; exit 1; }

      - name: Upload as a workflow artifact (dry run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-dry-run
          path: ${{ matrix.pattern }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.pattern }} --clobber
