# Packaging (TDD §17). Deliberately minimal: F2 was descoped on 2026-09-19 to
# "a build Andy can run", so there is no signing identity, no notarization and
# no update channel. Adding them later is config, not rework.
#
# No `asarUnpack` entry, and that is load-bearing rather than an omission: M2b
# packed an `app.asar` by hand and ran the app out of it to prove that both
# sql.js's wasm and the optimizer's worker thread load from inside the archive
# (see the comment in src/main/worker-spawn.ts for the symptom if that ever
# changes).
appId: io.github.96jonesa.ygo-deck-optimizer
productName: YGO Deck Optimizer
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - LICENSE
# Beside the app rather than only inside app.asar, where nobody can read them:
# the AGPL text of the app itself, and the licenses of the third-party packages
# bundled into it (`npm run notices`, which `package:*` runs first).
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: out/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
npmRebuild: false
# Puts Electron's and Chromium's licenses inside the macOS app before signing;
# on macOS electron-builder unpacks only `Electron.app` and would drop them.
afterPack: scripts/after-pack.cjs
# The release workflow owns publishing; electron-builder must never try, which
# it otherwise attempts on CI and fails wanting a token.
publish: null

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.utilities
  # AD-HOC signed: `"-"` signs the whole bundle with no identity. It is NOT the
  # same as `null`, which skips signing entirely — and that is what shipped from
  # v0.2.0 to v0.5.0: the bundle kept the stock Electron binary's own signature,
  # which no longer covered the renamed, repacked app, so an arm64 Mac reported
  # every downloaded copy as "damaged and can't be opened". The release workflow
  # now runs `codesign --verify --deep --strict` on the built app and fails if
  # it does not hold, so this cannot ship broken again unnoticed.
  #
  # Ad-hoc is not a Developer ID: a downloaded copy still carries the quarantine
  # flag and needs one approval on first launch (docs/INSTALL.md). A Developer
  # ID with notarization would remove that, and is deferred.
  identity: "-"
  # Off because nothing here is notarized, which is the only thing the hardened
  # runtime is for — and with an ad-hoc signature it is what electron-builder
  # warns can make library validation refuse Electron's own framework at launch.
  hardenedRuntime: false

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
